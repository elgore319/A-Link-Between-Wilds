name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        working-directory: server
        run: python -m unittest -v

  protocol:
    name: Protocol layout check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile header as C and C++ (static_asserts check packet sizes)
        run: |
          echo '#include "albw_protocol.h"' > check.c
          gcc -std=c11 -Wall -Werror -Iprotocol -c check.c -o /dev/null
          g++ -std=c++20 -Wall -Werror -Iprotocol -x c++ -c check.c -o /dev/null

  client-tests:
    name: Module unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run host tests (with sanitizers)
        working-directory: client/tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
              -I../source -I../../protocol test_config_parser.cpp -o test_config_parser
          ./test_config_parser
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
              -I../source test_build_id.cpp -o test_build_id
          ./test_build_id
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
              -I../source test_player_scan.cpp -o test_player_scan
          ./test_player_scan
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
              -I../source test_elf_symbols.cpp -o test_elf_symbols
          ./test_elf_symbols

  windows-scripts:
    name: Windows scripts parse check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse every .ps1 with Windows PowerShell 5.1 (what Lee's PC runs)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem tools -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
            if (-not $errors) { Write-Host "ok  $($_.Name)" }
          }
          if ($failed) { exit 1 }
      - name: Dry run of test-m1.ps1 -InstallOnly against a fake Ryujinx folder
        shell: powershell
        run: |
          $ryu = Join-Path $env:RUNNER_TEMP 'Ryujinx'
          $game = Join-Path $ryu 'games\01007ef00011e000'
          New-Item -ItemType Directory -Force -Path $game | Out-Null
          '{"selected":"C:\\Games\\BotW v1.6.0.nsp","paths":["C:\\Games\\BotW v1.6.0.nsp"]}' | Set-Content (Join-Path $game 'updates.json')
          '{"mods":[{"name":"albw","path":"C:\\x\\mods\\contents\\01007ef00011e000\\albw","enabled":false}]}' | Set-Content (Join-Path $game 'mods.json')
          $build = Join-Path $env:RUNNER_TEMP 'build'
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          Set-Content (Join-Path $build 'subsdk9') 'fake'
          Set-Content (Join-Path $build 'main.npdm') 'fake'
          .\tools\windows\test-m1.ps1 -Artifact $build -RyujinxDir $ryu -InstallOnly -Yes
          if (-not (Test-Path (Join-Path $ryu 'mods\contents\01007ef00011e000\albw\exefs\subsdk9'))) { throw 'module not installed' }
          if (-not (Test-Path (Join-Path $ryu 'sdcard\albw\config.ini'))) { throw 'config.ini not copied' }
          if ((Get-Content (Join-Path $game 'updates.json') -Raw | ConvertFrom-Json).selected) { throw 'update not switched off' }
          if (-not ((Get-Content (Join-Path $game 'mods.json') -Raw | ConvertFrom-Json).mods[0].enabled)) { throw 'mod not re-enabled' }
          Write-Host 'dry run ok'

  client:
    name: Switch module build
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Python (used by the exlaunch build scripts)
        run: |
          if ! command -v python3 >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends python3
          fi
      - name: Build
        working-directory: client
        shell: bash
        run: |
          # Build output is also turned into annotations, so errors show on the PR
          # and can be read through the API without downloading the full log.
          set -o pipefail
          if ! make -j"$(nproc)" 2>&1 | tee build.log; then
            grep -E "error|undefined reference|Error [0-9]" build.log | head -40 | while IFS= read -r line; do
              echo "::error title=Switch build::${line}"
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: albw-exefs
          path: client/deploy/
          if-no-files-found: error
