name: Research task
description: Something in the game that needs reverse engineering
labels: [research]
body:
  - type: textarea
    id: goal
    attributes:
      label: What we need to find
      placeholder: e.g. player animation state, function that spawns an actor
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it unlocks
  - type: textarea
    id: leads
    attributes:
      label: Leads
      description: Wii U/Cemu findings, community docs, Ghidra notes, anything already tried.
