# A Link Between Wilds - player settings
#
# Copy this file to your SD card as  albw/config.ini
#   Ryujinx:  <Ryujinx data folder>\sdcard\albw\config.ini
#             (File > Open Ryujinx Folder, or the "portable" folder for a portable install)
#   Switch:   SD:/albw/config.ini
#
# Any line you delete or get wrong falls back to the built-in default, and the
# Ryujinx log (with guest logs on) says which line was ignored and why.
# Full reference: docs/configuration.md

[albw]

# IPv4 address of the PC running server/albw_server.py. Default: 127.0.0.1
server_ip = 127.0.0.1

# Must match the server's --port. Default: 55420
server_port = 55420

# Shown to other players. 1-16 plain ASCII characters, spaces allowed. Default: Link
player_name = Link
